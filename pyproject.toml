[project]
name = "ngsolve-agent"
version = "0.1.0"
description = "Benchmark harness for reliable agentic workflows in NGSolve"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ngsolve>=6.2",
  "numpy>=2.0",
  "matplotlib>=3.9",
  "pydantic>=2.8",
  "langgraph>=1.0,<2.0",
  "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ngsolve_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
